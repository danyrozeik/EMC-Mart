version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rti
      POSTGRES_PASSWORD: rti
      POSTGRES_DB: rti
    ports:
      - "5432:5432"
    volumes:
      - rti_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  rti_postgres_data:
