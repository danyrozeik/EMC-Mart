<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMC-Mart</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121b2e;
      --panel-alt: #0f1729;
      --border: #23324d;
      --text: #e6ecf5;
      --text-dim: #93a3bf;
      --accent: #4da3ff;
      --accent-dim: #1f4a78;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding: 24px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .subtitle { color: var(--text-dim); margin: 0 0 28px; font-size: 13px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    a.card {
      display: block;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s;
    }
    a.card:hover {
      border-color: var(--accent);
      background: var(--panel-alt);
    }
    a.card .tag {
      display: inline-block;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    a.card h2 { font-size: 16px; margin: 0 0 6px; color: var(--text); }
    a.card p { margin: 0; color: var(--text-dim); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>EMC-Mart</h1>
    <p class="subtitle">Project index.</p>
    <div class="cards">
      <a class="card" href="esu-pad-supplier-matrix.html">
        <span class="tag">Tool</span>
        <h2>ESU Pad Supplier Matrix &amp; BOM Calculator</h2>
        <p>Raw material sourcing comparison and landed unit-cost rollup for electrosurgical return-electrode pad manufacturing.</p>
      </a>
      <a class="card" href="stack-drop/index.html">
        <span class="tag">Game</span>
        <h2>Stack Drop</h2>
        <p>A Tetris-style browser game with hold piece, touch controls, and high-score persistence.</p>
      </a>
    </div>
  </div>
</body>
</html>
